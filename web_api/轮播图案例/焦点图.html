<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQ音乐轮播图</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    li {
      list-style: none;
    }

    .main {
      width: 700px;
      margin: auto;
      background: #000;
    }

    .slides {
      height: 320px;
      position: relative;
      overflow: hidden;
    }

    .slides ul {
      display: flex;
      /* Set width to accommodate all slides including the cloned one */
    }

    .slides ul li {
      width: 100%;
    }


    .slides li.active {
      /* display: block; */
      /* opacity: 1; */
    }

    .slides .extra {
      width: 700px;
      height: 53px;
      line-height: 53px;
      position: absolute;
      bottom: 0px;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    .slides .extra h3 {
      width: 82%;
      margin: 0;
      margin-right: 20px;
      padding-left: 20px;
      color: #98E404;
      font-size: 28px;
      float: left;
      font-weight: 500;
      font-family: "Microsoft Yahei", Tahoma, Geneva;
    }

    .slides .extra a {
      width: 30px;
      height: 29px;
      display: block;
      float: left;
      margin-top: 12px;
      margin-right: 3px;
      background-image: url(./assets/icon_focus_switch.png);
    }

    .slides .extra .prev {
      background-position: 0 0;
    }

    .slides .extra .prev:hover {
      background-position: -30px 0;
    }

    .slides .extra .next {
      background-position: -60px 0;
    }

    .slides .extra .next:hover {
      background-position: -90px 0;
    }

    .indicator {
      padding: 10px 0;
    }

    .indicator ul {
      list-style-type: none;
      margin: 0 0 0 4px;
      padding: 0;
      overflow: hidden;
    }

    .indicator ul li {
      position: relative;
      float: left;
      width: 60px;
      margin: 0 4px 0 5px;
      text-align: center;

      cursor: pointer;
    }

    .indicator li img {
      display: block;
      border: 0;
      text-align: center;
      width: 60px;
    }

    .indicator li .mask {
      width: 60px;
      height: 60px;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .indicator li .border {
      display: none;
      width: 54px;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 20;
      border: 3px solid #98E404;
    }

    /* li里面的mask 和 border 刚开始都是显示的 */
    /* 我们写一个样式css */
    .indicator .active .mask {
      display: none;
    }

    .indicator .active .border {
      display: block;
      transform: translateX();
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="slides">
      <ul>
        <li class="active"><a href="#"><img src="./assets/b_01.jpg" alt="第1张图的描述信息"></a></li>
        <li><a href="#"><img src="./assets/b_02.jpg" alt="第2张图的描述信息"></a></li>
        <li><a href="#"><img src="./assets/b_03.jpg" alt="第3张图的描述信息"></a></li>
      </ul>

      <div class="extra">
        <h3>第1张图的描述信息</h3>
        <a class="prev" href="javascript:;"></a>
        <a class="next" href="javascript:;"></a>
      </div>
    </div>
    <div class="indicator">
      <ul>
        <li class="active">
          <img src="assets/s_01.jpg">
          <span class="mask"></span>
          <span class="border"></span>
        </li>
        <li>
          <img src="assets/s_02.jpg">
          <span class="mask"></span>
          <span class="border"></span>
        </li>
        <li>
          <img src="assets/s_03.jpg">
          <span class="mask"></span>
          <span class="border"></span>
        </li>
      </ul>
    </div>
  </div>

</body>

<script>
  let top_ul = document.querySelector(".slides ul")
  let top_children = document.querySelector(".slides ul").children;
  let lies = document.querySelectorAll(".indicator ul> li");

  // Clone first li and append it to ul
  const firstLi = top_ul.querySelector("li:first-child");
  const clonedLi = firstLi.cloneNode(true);
  top_ul.appendChild(clonedLi);

  Array.from(lies).forEach((li) => {
    li.addEventListener("click", function (event) {
      document.querySelector(".indicator ul .active").classList = ""
      document.querySelector(".slides ul .active").classList = ""
      this.classList = "active";

      // 获取被点击的li元素
      let targetLi = event.target;
      console.log("targetLi", targetLi.innerHTML)
      while (targetLi && !targetLi.matches('li')) {
        targetLi = targetLi.parentNode;
      }

      // 获取li元素在父元素中的索引
      const index = Array.from(lies).indexOf(targetLi);
      console.log("index", index);
      top_children[index].classList = "active";
    });
  });




  let index = 0;
  setInterval(() => {
    let li_width = top_children[0].offsetWidth;

    // 处理索引，用于指示器同步
    let indicatorIndex = index;
    if (indicatorIndex >= lies.length) {
      indicatorIndex = 0;
    }

    // 更新指示器状态
    document.querySelector(".indicator ul .active").classList.remove("active");
    lies[indicatorIndex].classList.add("active");

    // 处理轮播图切换
    if (index > top_children.length - 1) {
      index = 0;
      top_ul.style.transition = 'none';
      top_ul.style.transform = `translateX(0)`;
      // 强制重绘
      top_ul.offsetHeight;
    }

    top_ul.style.transition = `all 1s`;
    top_ul.style.transform = `translateX(-${(li_width * index)}px)`;
    index++;

  }, 2000);
</script>

</html>
