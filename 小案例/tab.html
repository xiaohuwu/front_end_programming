<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .tab {
            width: 500px;
            height: 300px;
            margin: 10px auto;
            border: solid 1px silver;
        }

        ul {
            list-style: none;
            display: flex;
            height: 50px;
            line-height: 50px;

            li {
                flex: 1;
                text-align: center;
            }

        }

        ul li:last-child {
            border-right: none;
        }

        .tab>div {
            width: 100%;
            height: 250px;
            display: none;
        }

        .active {
            background-color: white;
            border-bottom: none;
        }

        nav {
            position: relative;

            .line {
                z-index: 100;
                width: 80px;
                height: 2px;
                background-color: pink;
                position: absolute;
                bottom: 0px;
                left: 0px;
            }
        }
    </style>
</head>

<body>
    <div class="tab">
        <nav>
            <ul>
                <li class="active">娱乐</li>
                <li>经济</li>
                <li>科技</li>
                <li>时事</li>
            </ul>
            <div class="line"></div>
        </nav>

        <div style="display: block;">娱乐 部分</div>
        <div>经济 部分</div>
        <div>科技 部分</div>
        <div>时事 部分</div>
    </div>
</body>

</html>
<script>

    let li_array = document.querySelectorAll("ul > li")
    let divs = document.querySelectorAll(".tab >  div")
    let line = document.querySelector(".line")
    for (let i = 0; i < li_array.length; i++) {
        li_array[i].index = i;
        li_array[i].onmouseover = function () {
            for (let j = 0; j < li_array.length; j++) {
                li_array[j].className = "";
                divs[j].style.display = "none";
            }
            let offset = (parseInt(this.offsetWidth) - 80) / 2;
            let number = this.index * parseInt(this.offsetWidth) + offset;
            line.style.transform = `translateX(${number}px)`;
            line.style.transition = `all 0.5s`;
            this.className = "active";
            divs[this.index].style.display = "block";
        }
    }
    let offset = (parseInt(li_array[0].offsetWidth) - 80) / 2;
    line.style.transform = `translateX(${offset}px)`;
</script>
