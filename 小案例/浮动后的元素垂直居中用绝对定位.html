<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            height: 200px;
            /* 容器高度 */
            background: #f0f0f0;
            text-align: center;
            /* 可选水平居中 */
        }

        /* 关键代码开始 */
        .container::before {
            content: '';
            /* 必须设置内容 */
            display: inline-block;
            height: 100%;
            /* 撑满容器高度 */
            vertical-align: middle;
            /* 基线对齐 */
        }

        .child {
            display: inline-block;
            vertical-align: middle;
            /* 与伪元素中线对齐 */
            padding: 10px;
            background: #2196F3;
            color: white;
        }

        /* 关键代码结束 */
    </style>
</head>

<body>
    <div class="container">
        <span class="child">
            垂直居中的内容<br>
            支持多行文本
        </span>
    </div>
</body>

</html>
