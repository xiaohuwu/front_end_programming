<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          div {
            width: 400px;
            height: 400px;
            border: solid 1px red;
            position: absolute;
            top: -400px;
            transition: all 1s linear; /* 改用过渡 */
        }

        .active {
            top: 0;
        }
        body{
            height: 600px;
        }
    </style>
</head>

<body onclick="deal();">
    <div ></div>
</body>

</html>
<script>
  function deal() {
        console.log("deal");
        let div = document.querySelector("div");
        div.classList.add("active");
    }

</script>
